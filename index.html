<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Photo Gallery</title>
    <link rel="stylesheet" href="css/gallery.css">
    <script src="js/gallery.js"></script>
</head>
<body onload="addTabIndex()">

    <h1>Accessible Photo Gallery</h1>

    <div id="image">
        Hover over or focus on an image below to display here.
    </div>
    
    <!-- 6 ảnh tùy chọn, tích hợp sự kiện chuột và bàn phím (focus/blur) -->
    <img class="preview" alt="Cảnh thiên nhiên 1" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="Cảnh thiên nhiên 2" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="Cảnh thiên nhiên 3" src="https://images.unsplash.com/photo-1426604966848-d7adacbd02bff?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Cảnh thiên nhiên 4" src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Cảnh thiên nhiên 5" src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Cảnh thiên nhiên 6" src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=600" 
         onmouseover="upDate(this)" onmouseleave="unDo()" 
         onfocus="upDate(this)" onblur="unDo()">

</body>
</html>
